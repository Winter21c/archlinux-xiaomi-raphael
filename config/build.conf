# ============================================================================
#  Raphael Arch Linux 构建配置 / Build configuration
#  设备: Xiaomi Redmi K20 Pro / K20 Pro 尊享版 / Mi 9T Pro  (SM8150 "raphael")
#  引导: GengWei1997 U-Boot -> systemd-boot -> Linux (EFI stub)
# ============================================================================

# ---- 上游镜像源 (Arch Linux ARM aarch64) -----------------------------------
ALARM_MIRROR_PRIMARY="https://mirrors.ustc.edu.cn/archlinuxarm"
ALARM_MIRROR_FALLBACK="https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm"
ALARM_ROOTFS_URL="http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"

# ---- 内核 (作者预编译 Debian 包, 我们重打包成 Arch 布局) --------------------
KERNEL_VERSION="7.2"
KERNEL_TAG="kernel-v${KERNEL_VERSION}"
KERNEL_REPO="GengWei1997/kernel-deb"
KERNEL_DEB_BASE="https://github.com/${KERNEL_REPO}/releases/download/${KERNEL_TAG}"

# ---- 引导相关 --------------------------------------------------------------
UBOOT_RELEASE_URL="https://github.com/GengWei1997/linux-xiaomi-raphael-uboot/releases/download/v1.0.0"
UBOOT_IMG_ZIP="u-boot-sm8150-xiaomi-raphael-20260911.zip"
BOOT_IMG_URL="https://github.com/${KERNEL_REPO}/releases/download/v1.0.0/xiaomi-k20pro-boot.img"

# ---- 系统镜像 --------------------------------------------------------------
IMAGE_SIZE="8G"                 # rootfs.img 大小 (首启动会自动扩容到 userdata 分区实际大小)
ROOTFS_UUID_FILE="work/rootfs.uuid"
BOOTFAT_SIZE_MB=256             # cache 分区 FAT32 镜像大小 (与官方 boot.img 一致)

# ---- 系统标识 --------------------------------------------------------------
HOSTNAME="raphael"
TIMEZONE="Asia/Shanghai"
LOCALE="zh_CN.UTF-8"
KEYMAP="us"

# ---- 账户 ------------------------------------------------------------------
USERNAME="winter"
USER_PASSWORD="winter"
ROOT_PASSWORD="root"
AUTOLOGIN="true"                # SDDM 自动登录 (手机场景推荐)

# ---- 软件包组 --------------------------------------------------------------
# 基础工具
PKGS_BASE="sudo nano vim openssh networkmanager chrony curl wget bash-completion \
htop less rsync unzip zip git tmux iproute2 iputils ethtool usbutils pciutils \
kmod e2fsprogs dosfstools exfatprogs parted util-linux zram-generator \
dbus polkit upower udisks2 logrotate man-db man-pages \
glibc-locales tzdata busybox"

# 固件 (最大化硬件支持)
# 注意: 不装 linux-firmware-atheros — 它的 WCN3990 未压缩固件会覆盖作者提供的
# 设备专属固件 (内核固件加载器优先使用无后缀文件名), 详见 04-firmware.sh。
PKGS_FIRMWARE="linux-firmware-qcom linux-firmware-other"

# 音频
PKGS_AUDIO="pipewire pipewire-pulse pipewire-alsa pipewire-jack wireplumber \
alsa-utils alsa-ucm-conf libldac"

# 蓝牙
PKGS_BT="bluez bluez-utils bluez-libs bluez-qt bluedevil"

# 蜂窝网络 / 传感器
PKGS_MODEM="modemmanager libqmi libmbim usb_modeswitch iio-sensor-proxy"

# 显示 / GPU
PKGS_GPU="mesa mesa-utils vulkan-freedreno vulkan-icd-loader libva-mesa-driver"

# KDE Plasma 桌面 + Plasma Mobile
PKGS_KDE="plasma-desktop plasma-mobile sddm sddm-kcm plasma-nm plasma-pa powerdevil \
plasma-settings plasma-nano plasma-keyboard plasma-integration kscreen plasma-x11-session \
kde-gtk-config breeze breeze-gtk breeze-icons kde-cli-tools khotkeys \
kdecoration kgamma kscreenlocker kwin kwin-x11 kwrited libkscreen libksysguard \
milou polkit-kde-agent systemsettings bluedevil kdeconnect \
dolphin konsole kate ark gwenview spectacle okular khelpcenter \
plasma-welcome plasma-systemmonitor discover packagekit-qt6 \
qqc2-breeze-style plasma-bigscreen qt6-multimedia-ffmpeg \
tesseract-data-eng tesseract-data-chi_sim"

# 手机端应用 (存在才装, 不存在会自动跳过并告警)
# 注意: plasma-camera 依赖 libpisp, ALARM 未打包; plasma-dialer/phonebook 在 ALARM 仓库中不存在
PKGS_MOBILE_EXTRA="angelfish plasma-pass qrca"

# 字体 (中文 + emoji)
PKGS_FONTS="noto-fonts noto-fonts-cjk noto-fonts-emoji ttf-dejavu wqy-microhei \
ttf-liberation adobe-source-han-sans-cn-fonts"

# Wayland / X11 兼容
PKGS_WAYLAND="wayland wayland-utils xorg-xwayland qt6-wayland xdg-desktop-portal \
xdg-desktop-portal-kde xdg-utils"

# USB 网络共享 (NCM) 需要
PKGS_NET="dnsmasq nftables iw wpa_supplicant wireless-regdb crda"

ALL_PKGS="${PKGS_BASE} ${PKGS_FIRMWARE} ${PKGS_AUDIO} ${PKGS_BT} ${PKGS_MODEM} \
${PKGS_GPU} ${PKGS_KDE} ${PKGS_MOBILE_EXTRA} ${PKGS_FONTS} ${PKGS_WAYLAND} ${PKGS_NET}"
