# ---- 重复功能的软件只保留一个 (2026-10-11 用户要求) ------------------------
#   多个桌面一起装时, 同功能的软件会重复好几份 (终端/文件管理器/PDF/图片/监视器…)。
#   规则: 装了 KDE 就用 KDE 的那份, 把 GNOME 系里同功能的去掉:
#     终端 konsole ← gnome-console     文件管理器 dolphin ← nautilus
#     PDF  okular  ← papers            图片 gwenview ← loupe
#     视频 (KDE 没装) ← showtime       监视器 plasma-systemmonitor ← gnome-system-monitor
#     文本编辑 kate ← gnome-text-editor (kate 只在桌面形态装)
#   不可替代的**不动**: gnome-control-center (GNOME/phosh 的设置中枢)、
#   phosh-mobile-settings、squeekboard、gnome-calls/chatty (手机专属 app)、
#   gnome-disk-utility / gnome-font-viewer (KDE 侧没有对应物)。
drop_pkgs() {   # drop_pkgs <包列表变量名> <要删的包...>
  local var="$1"; shift
  local list="${!var}" p
  for p in "$@"; do list="$(printf '%s' "$list" | sed -E "s/(^| )$p( |$)/ /g")"; done
  printf -v "$var" '%s' "$list"
}
PKGS_DEDUPED=""
PKGS_PRUNE=""   # 去重时被去掉的包 (02 阶段会把树里已有的删掉)
if [ "$HAVE_KDE" = 1 ]; then
