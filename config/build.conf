# ============================================================================
#  Raphael Arch Linux 构建配置 / Build configuration
#  设备: Xiaomi Redmi K20 Pro / K20 Pro 尊享版 / Mi 9T Pro  (SM8150 "raphael")
#  引导: GengWei1997 U-Boot -> systemd-boot -> Linux (EFI stub)
# ============================================================================

# ---- 上游镜像源 (Arch Linux ARM aarch64) -----------------------------------
# 可用环境变量覆盖 (线上编译时 runner 在海外, 用官方源更快):
#   RAPHAEL_ALARM_MIRROR_PRIMARY / RAPHAEL_ALARM_MIRROR_FALLBACK
ALARM_MIRROR_PRIMARY="${RAPHAEL_ALARM_MIRROR_PRIMARY:-https://mirrors.ustc.edu.cn/archlinuxarm}"
ALARM_MIRROR_FALLBACK="${RAPHAEL_ALARM_MIRROR_FALLBACK:-https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm}"
ALARM_ROOTFS_URL="http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"

# ---- 内核 (作者预编译 Debian 包, 我们重打包成 Arch 布局) --------------------
KERNEL_VERSION="7.2"
KERNEL_TAG="kernel-v${KERNEL_VERSION}"
KERNEL_REPO="GengWei1997/kernel-deb"
KERNEL_DEB_BASE="https://github.com/${KERNEL_REPO}/releases/download/${KERNEL_TAG}"

# ---- 引导相关 --------------------------------------------------------------
UBOOT_RELEASE_URL="https://github.com/GengWei1997/linux-xiaomi-raphael-uboot/releases/download/v1.0.0"
UBOOT_IMG_ZIP="u-boot-sm8150-xiaomi-raphael-20260911.zip"
BOOT_IMG_URL="https://github.com/${KERNEL_REPO}/releases/download/v1.0.0/xiaomi-k20pro-boot.img"

# ---- 系统镜像 --------------------------------------------------------------
# 根文件系统类型: btrfs (默认, 参考 Shorin 指南) 或 ext4
#  * btrfs  + 透明压缩 compress=zstd:3, 子卷 @ / @home
#  * 创建子卷需要挂载文件系统 -> 需要 root。构建脚本会自动判断:
#      有 root (CI / sudo) -> 完整 @ / @home 布局
#      无 root (本机无 sudo) -> 单子卷 btrfs (数据在顶层), 引导参数自动匹配
#    两种产出的镜像都能正常启动, 只是子卷布局不同。
ROOTFS_TYPE="${RAPHAEL_ROOTFS_TYPE:-btrfs}"
BTRFS_COMPRESS="${RAPHAEL_BTRFS_COMPRESS:-zstd:3}"
BTRFS_SUBVOL_ROOT="@"
BTRFS_SUBVOL_HOME="@home"
IMAGE_SIZE="8G"                 # rootfs.img 大小 (首启动会自动扩容到 userdata 分区实际大小)
ROOTFS_UUID_FILE="work/rootfs.uuid"
BOOTFAT_SIZE_MB=256             # cache 分区 FAT32 镜像大小 (与官方 boot.img 一致)

# ---- 系统形态 --------------------------------------------------------------
#   mobile  = Plasma Mobile (手机形态, 默认): 带 plasma-mobile 外壳 + 手机应用
#   desktop = 桌面版 Plasma: 精简包列表 (去掉 plasma-mobile / 手机应用 / 一堆
#             用不到的大件), 自动登录到普通桌面会话 (面板 + 开始菜单)
# 可以用环境变量覆盖 (CI 的 session 输入就是走这个): SESSION=desktop ./build.sh
SESSION="${SESSION:-mobile}"

# ---- 系统标识 --------------------------------------------------------------
HOSTNAME="raphael"
TIMEZONE="Asia/Shanghai"
LOCALE="zh_CN.UTF-8"
KEYMAP="us"

# ---- 账户 ------------------------------------------------------------------
USERNAME="user"
USER_PASSWORD="1234"   # 4 位 PIN: 锁屏是数字键盘, 方便解锁
ROOT_PASSWORD="1234"
AUTOLOGIN="true"                # SDDM 自动登录 (手机场景推荐)

# ---- 软件包组 --------------------------------------------------------------
# 基础工具 (btrfs-progs: 根是 btrfs; 编辑器只要 neovim+vim, 不要 nano)
PKGS_BASE="sudo neovim vim openssh networkmanager chrony curl wget bash-completion \
htop less rsync unzip zip git tmux iproute2 iputils ethtool usbutils pciutils \
kmod e2fsprogs btrfs-progs dosfstools exfatprogs parted util-linux zram-generator \
dbus polkit upower udisks2 logrotate man-db man-pages \
glibc-locales tzdata busybox \
snapper inotify-tools power-profiles-daemon flatpak \
zsh zsh-completions zsh-autosuggestions zsh-syntax-highlighting starship \
konsole kdeconnect noto-fonts noto-fonts-cjk noto-fonts-emoji"

# 固件 (最大化硬件支持)
# 注意: 不装 linux-firmware-atheros — 它的 WCN3990 未压缩固件会覆盖作者提供的
# 设备专属固件 (内核固件加载器优先使用无后缀文件名), 详见 04-firmware.sh。
PKGS_FIRMWARE="linux-firmware-qcom linux-firmware-other"

# 音频
PKGS_AUDIO="pipewire pipewire-pulse pipewire-alsa pipewire-jack wireplumber \
alsa-utils alsa-ucm-conf libldac"

# 蓝牙
PKGS_BT="bluez bluez-utils bluez-libs bluez-qt bluedevil"

# 蜂窝网络 / 传感器
PKGS_MODEM="modemmanager libqmi libmbim usb_modeswitch iio-sensor-proxy"

# 显示 / GPU
PKGS_GPU="mesa mesa-utils vulkan-freedreno vulkan-icd-loader libva-mesa-driver"

# KDE Plasma: 公共部分 (两种形态都要)
#   plasma-desktop  : 桌面外壳 (含 plasma-workspace)
#   plasma-keyboard : ★ 屏幕键盘 —— 这台设备没有物理键盘, 两个形态都必须有
#   konsole/dolphin : 终端 + 文件管理器 (终端是刚需)
#   systemsettings  : 设置界面 (改键盘语言、显示、网络都靠它)
PKGS_KDE_COMMON="plasma-desktop sddm plasma-nm plasma-pa powerdevil \
plasma-keyboard plasma-integration kscreen kde-gtk-config breeze breeze-gtk breeze-icons \
kde-cli-tools kdecoration kscreenlocker kwin polkit-kde-agent systemsettings \
dolphin konsole bluedevil qqc2-breeze-style qt6-multimedia-ffmpeg sddm-kcm"

# 手机形态额外部分 (Plasma Mobile 外壳 + 手机应用 + 顺手带上的桌面应用)
PKGS_KDE_MOBILE_EXTRA="plasma-mobile plasma-settings plasma-nano plasma-x11-session \
khotkeys kgamma kwin-x11 kwrited libkscreen libksysguard milou \
ark gwenview spectacle okular khelpcenter plasma-welcome plasma-systemmonitor \
discover packagekit-qt6 tesseract-data-eng tesseract-data-chi_sim"

# 桌面形态额外部分 (精简到"能用的桌面": 只多一个文本编辑器)
PKGS_KDE_DESKTOP_EXTRA="kate"

# 字体: 公共 (中文 + emoji + 终端等宽 Nerd 字体)
PKGS_FONTS_COMMON="noto-fonts noto-fonts-cjk noto-fonts-emoji ttf-jetbrains-mono-nerd"
# 手机形态额外字体 (字形更全; 桌面形态精简掉)
PKGS_FONTS_MOBILE_EXTRA="ttf-dejavu wqy-microhei ttf-liberation adobe-source-han-sans-cn-fonts"

# 手机端应用 (存在才装, 不存在会自动跳过并告警)
# 注意: plasma-camera 依赖 libpisp, ALARM 未打包; plasma-dialer/phonebook 在 ALARM 仓库中不存在
PKGS_MOBILE_APPS="angelfish plasma-pass qrca"

# archlinuxcn 源里的工具 (AUR 助手 + 密钥环; 密钥环是 archlinuxcn 源能用的前提)
PKGS_CN_FULL="paru yay archlinuxcn-keyring"
PKGS_CN_MIN="paru archlinuxcn-keyring"

# ---- 按形态拼装最终包列表 --------------------------------------------------
if [ "${SESSION:-mobile}" = "desktop" ]; then
  PKGS_KDE="${PKGS_KDE_COMMON} ${PKGS_KDE_DESKTOP_EXTRA}"
  PKGS_MOBILE_EXTRA=""
  PKGS_FONTS="${PKGS_FONTS_COMMON}"
  PKGS_CN="${PKGS_CN_MIN}"
  # 桌面版精简: 这几个体积大/用不到 (flatpak 会带进一整套运行时)
  PKGS_BASE="$(printf '%s' "$PKGS_BASE" | sed -E 's/ (flatpak|kdeconnect|man-pages|vim)( |$)/ /g')"
else
  PKGS_KDE="${PKGS_KDE_COMMON} ${PKGS_KDE_MOBILE_EXTRA}"
  PKGS_MOBILE_EXTRA="${PKGS_MOBILE_APPS}"
  PKGS_FONTS="${PKGS_FONTS_COMMON} ${PKGS_FONTS_MOBILE_EXTRA}"
  PKGS_CN="${PKGS_CN_FULL}"
fi

# 中文输入法: ★ 不预装 fcitx5
#   触摸屏上的输入由 plasma-keyboard (qtvirtualkeyboard) 负责, 中文用它自带的
#   拼音插件, 不需要 fcitx5; 两者同时存在会互相抢输入法 —— 真机实测: KWin 会
#   莫名其妙选中 fcitx5, 然后屏幕键盘反复闪退。
#   外接物理键盘想用中州韵的话, 用户自己装: sudo pacman -S fcitx5 fcitx5-rime
PKGS_IME=""

# Wayland / X11 兼容
PKGS_WAYLAND="wayland wayland-utils xorg-xwayland qt6-wayland xdg-desktop-portal \
xdg-desktop-portal-kde xdg-utils"

# USB 网络共享 (NCM) 需要
PKGS_NET="dnsmasq nftables iw wpa_supplicant wireless-regdb crda"

ALL_PKGS="${PKGS_BASE} ${PKGS_FIRMWARE} ${PKGS_AUDIO} ${PKGS_BT} ${PKGS_MODEM} \
${PKGS_GPU} ${PKGS_KDE} ${PKGS_MOBILE_EXTRA} ${PKGS_FONTS} ${PKGS_IME} \
${PKGS_WAYLAND} ${PKGS_NET} ${PKGS_CN}"
