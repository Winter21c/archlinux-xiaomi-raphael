# ---- 上游镜像源 (Arch Linux ARM aarch64) -----------------------------------
# 可用环境变量覆盖 (线上编译时 runner 在海外, 用官方源更快):
#   RAPHAEL_ALARM_MIRROR_PRIMARY / RAPHAEL_ALARM_MIRROR_FALLBACK
ALARM_MIRROR_PRIMARY="${RAPHAEL_ALARM_MIRROR_PRIMARY:-https://mirrors.ustc.edu.cn/archlinuxarm}"
ALARM_MIRROR_FALLBACK="${RAPHAEL_ALARM_MIRROR_FALLBACK:-https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm}"
ALARM_ROOTFS_URL="http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"

# ---- 内核 (作者预编译 Debian 包, 我们重打包成 Arch 布局) --------------------
KERNEL_VERSION="7.2"
KERNEL_TAG="kernel-v${KERNEL_VERSION}"
KERNEL_REPO="GengWei1997/kernel-deb"
KERNEL_DEB_BASE="https://github.com/${KERNEL_REPO}/releases/download/${KERNEL_TAG}"

# ---- 引导相关 --------------------------------------------------------------
UBOOT_RELEASE_URL="https://github.com/GengWei1997/linux-xiaomi-raphael-uboot/releases/download/v1.0.0"
UBOOT_IMG_ZIP="u-boot-sm8150-xiaomi-raphael-20260911.zip"
BOOT_IMG_URL="https://github.com/${KERNEL_REPO}/releases/download/v1.0.0/xiaomi-k20pro-boot.img"

# ---- 系统镜像 --------------------------------------------------------------
# 根文件系统类型: btrfs (默认, 参考 Shorin 指南) 或 ext4
#  * btrfs  + 透明压缩 compress=zstd:3, 子卷 @ / @home
#  * 创建子卷需要挂载文件系统 -> 需要 root。构建脚本会自动判断:
#      有 root (CI / sudo) -> 完整 @ / @home 布局
#      无 root (本机无 sudo) -> 单子卷 btrfs (数据在顶层), 引导参数自动匹配
#    两种产出的镜像都能正常启动, 只是子卷布局不同。
ROOTFS_TYPE="${RAPHAEL_ROOTFS_TYPE:-btrfs}"
BTRFS_COMPRESS="${RAPHAEL_BTRFS_COMPRESS:-zstd:3}"
BTRFS_SUBVOL_ROOT="@"
BTRFS_SUBVOL_HOME="@home"
# 交换文件放在独立子卷 (btrfs 上交换文件必须 nocow 且不能被压缩, 独立子卷最干净)
BTRFS_SUBVOL_SWAP="@swap"
BTRFS_SWAP_SIZE="${RAPHAEL_BTRFS_SWAP_SIZE:-4G}"   # 首启动创建; 设 0 则不建交换文件

# 无线管制域: 决定 5GHz 频段能不能用。世界域(00)下很多 5GHz 信道是禁用的,
# 想在设备上连 5GHz 就得设置成实际国家码 (在引导参数里传 cfg80211.ieee80211_regdom)
WIFI_COUNTRY="${RAPHAEL_WIFI_COUNTRY:-CN}"
# rootfs.img 大小: 这是**下限**, 不是死值 —— 阶段 09 会按实际内容自动放大
# (多个桌面一起装时内容会明显变大; 单装 Plasma Mobile 约 7 GB)。
# 首启动由 fstab 的 x-systemd.growfs 扩容到 userdata 分区实际大小。
IMAGE_SIZE="8G"
ROOTFS_UUID_FILE="work/rootfs.uuid"
BOOTFAT_SIZE_MB=256             # cache 分区 FAT32 镜像大小 (与官方 boot.img 一致)

# ---- 桌面环境 (可多选; 全不选 = 纯命令行) ----------------------------------
#   取值 (空格或逗号分隔; **顺序 = 自动登录的优先级**):
#     plasma-mobile   Plasma Mobile 手机外壳 (触屏键盘 / 手机应用 / 移动设置)
#     plasma-desktop  普通 Plasma 桌面 (面板 + 开始菜单 + Kate)
#     phosh           Phosh (GNOME 手机外壳) + squeekboard 触屏键盘 + 通话/短信
#     gnome           GNOME 桌面 (gnome-shell + nautilus + 控制中心 ...)
#
#   例:
#     DESKTOPS="plasma-mobile" ./build.sh            # 默认: 手机形态 Plasma
#     DESKTOPS="plasma-desktop" ./build.sh           # 只要桌面版 Plasma
#     DESKTOPS="plasma-mobile phosh" ./build.sh      # 装两个, 自动登录进 Plasma Mobile
#     DESKTOPS="gnome phosh plasma-desktop plasma-mobile" ./build.sh   # 全选
#     DESKTOPS="" ./build.sh                         # 纯命令行 (不装桌面/登录器/字体)
#
#   ★ 登录界面统一用 SDDM: 装了哪个桌面它就列出哪个会话 (Plasma Mobile / Plasma /
#     Phosh / GNOME), 登录时随便切; 自动登录进 DESKTOPS 里的第一个。
#   ★ 纯命令行模式(= 空): 不装显示管理器、不开 graphical.target、不自动登录,
#     控制台停在登录提示, SSH (USB NCM 172.16.42.1 / Wi-Fi) 照常可用。
#   ★ 兼容旧写法: 只有 DESKTOPS 完全没设置时才回退看 SESSION=mobile|desktop|none
if [ -z "${DESKTOPS+x}" ]; then
  case "${SESSION:-mobile}" in
    desktop)      DESKTOPS="plasma-desktop" ;;
    none|cli|"")  DESKTOPS="" ;;
    *)            DESKTOPS="plasma-mobile" ;;
  esac
fi
# 归一化 (小写 / 逗号转空格 / 别名 / 去重 / 校验)
DESKTOPS="$(printf '%s' "$DESKTOPS" | tr ',' ' ' | tr 'A-Z' 'a-z')"
_norm=""
for _d in $DESKTOPS; do
  case "$_d" in
    plasma-mobile|plasma_mobile|mobile|kde-mobile)   _d="plasma-mobile" ;;
    plasma-desktop|plasma_desktop|desktop|plasma|kde) _d="plasma-desktop" ;;
    phosh)                                            _d="phosh" ;;
    gnome|gnome-desktop)                              _d="gnome" ;;
    *) echo "config/build.conf: 未知桌面 '$_d' (可选: plasma-mobile plasma-desktop phosh gnome; 留空 = 纯命令行)" >&2; exit 1 ;;
  esac
  case " $_norm " in *" $_d "*) continue ;; esac
  _norm="${_norm:+$_norm }$_d"
done
DESKTOPS="$_norm"
unset _norm _d

# 组合标志 (阶段脚本用这些判断, 不要再去解析字符串)
de_has() { case " $DESKTOPS " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }
# 会话名 = /usr/share/wayland-sessions/<名>.desktop (SDDM 的 Session= 就是它)
de_session_name() {
  case "$1" in
    plasma-mobile)  echo plasma-mobile ;;
    plasma-desktop) echo plasma ;;
    phosh)          echo phosh ;;
    gnome)          echo gnome ;;
  esac
}
HAVE_PLASMA_MOBILE=0; de_has plasma-mobile  && HAVE_PLASMA_MOBILE=1
HAVE_PLASMA_DESKTOP=0; de_has plasma-desktop && HAVE_PLASMA_DESKTOP=1
HAVE_PHOSH=0;         de_has phosh          && HAVE_PHOSH=1
HAVE_GNOME=0;         de_has gnome          && HAVE_GNOME=1
HAVE_KDE=0;           { [ "$HAVE_PLASMA_MOBILE" = 1 ] || [ "$HAVE_PLASMA_DESKTOP" = 1 ]; } && HAVE_KDE=1
# 手机外壳 (Plasma Mobile / Phosh): 决定字体、手机应用、yay、精简策略
HAVE_MOBILE_SHELL=0;  { [ "$HAVE_PLASMA_MOBILE" = 1 ] || [ "$HAVE_PHOSH" = 1 ]; } && HAVE_MOBILE_SHELL=1
HAVE_ANY_DE=0;        [ -n "$DESKTOPS" ] && HAVE_ANY_DE=1
# 自动登录进哪个会话 = DESKTOPS 里的第一个 (纯命令行时为空)
PRIMARY_DE="${DESKTOPS%% *}"
PRIMARY_SESSION="$(de_session_name "$PRIMARY_DE")"
# 给日志/CI 用的人话摘要
_de_pretty() {
  case "$1" in
    plasma-mobile)  echo "Plasma Mobile" ;;
    plasma-desktop) echo "Plasma 桌面" ;;
    phosh)          echo "Phosh" ;;
    gnome)          echo "GNOME" ;;
  esac
}
DE_SUMMARY=""
for _d in $DESKTOPS; do DE_SUMMARY="${DE_SUMMARY:+$DE_SUMMARY + }$(_de_pretty "$_d")"; done
[ -n "$DE_SUMMARY" ] || DE_SUMMARY="纯命令行"
unset _d

