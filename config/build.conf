  PKGS_PRUNE="$PKGS_PRUNE gnome-console nautilus"
  PKGS_DEDUPED="${PKGS_DEDUPED:+$PKGS_DEDUPED, }终端→konsole 文件→dolphin"
fi
if [ "$HAVE_PLASMA_MOBILE" = 1 ]; then
  drop_pkgs PKGS_DESKTOP_OTHER papers loupe showtime gnome-system-monitor
  PKGS_PRUNE="$PKGS_PRUNE papers loupe showtime gnome-system-monitor"
  PKGS_DEDUPED="${PKGS_DEDUPED:+$PKGS_DEDUPED, }PDF→okular 图片→gwenview 监视器→plasma-systemmonitor"
fi
if [ "$HAVE_PLASMA_DESKTOP" = 1 ]; then
  drop_pkgs PKGS_DESKTOP_OTHER gnome-text-editor
  PKGS_PRUNE="$PKGS_PRUNE gnome-text-editor"
  PKGS_DEDUPED="${PKGS_DEDUPED:+$PKGS_DEDUPED, }编辑器→kate"
fi

# 中文输入法: ★ 不预装 fcitx5
#   触摸屏上的输入由 plasma-keyboard (qtvirtualkeyboard) / phosh 的 squeekboard
#   / GNOME 自带屏幕键盘负责, 中文用它们自带的拼音插件, 不需要 fcitx5;
#   两者同时存在会互相抢输入法 —— 真机实测: KWin 会莫名其妙选中 fcitx5, 然后
#   屏幕键盘反复闪退。外接物理键盘想用中州韵的话, 用户自己装:
#   sudo pacman -S fcitx5 fcitx5-rime
# 中文输入法 (fcitx5 + Rime): **只在桌面形态装**。
#   手机形态用系统自带触屏键盘 (plasma-keyboard / squeekboard), fcitx5 与它同时
#   存在会互相抢输入法 —— 真机实测 KWin 会去拉 fcitx5 导致触屏键盘闪退,
#   所以手机形态保持不装 (见下面 06/07 阶段的输入法环境说明)。
PKGS_IME=""
if [ "$HAVE_PLASMA_DESKTOP" = 1 ]; then
  PKGS_IME="fcitx5 fcitx5-rime fcitx5-qt fcitx5-gtk fcitx5-configtool"
fi

ALL_PKGS="${PKGS_BASE} ${PKGS_FIRMWARE} ${PKGS_AUDIO} ${PKGS_BT} ${PKGS_MODEM} \
${PKGS_GPU} ${PKGS_DM} ${PKGS_KDE} ${PKGS_DESKTOP_OTHER} ${PKGS_MOBILE_EXTRA} \
${PKGS_FONTS} ${PKGS_IME} ${PKGS_PORTALS} ${PKGS_NET} ${PKGS_CN}"

